site_name: "BLAG: Are You Bluffing? · Knowledge base"
site_description: "Everything about BLAG, researched and decided before development. Readable by people and AI agents."
site_url: https://vishnu1762.github.io/blag/
repo_url: https://github.com/VIsHnu1762/blag
edit_uri: edit/main/kb/
docs_dir: kb
strict: false

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle: {icon: material/weather-sunny, name: Light mode}
    - scheme: default
      primary: deep purple
      accent: amber
      toggle: {icon: material/weather-night, name: Dark mode}
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - toc.follow

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - toc: {permalink: true}
  - pymdownx.tasklist: {custom_checkbox: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

not_in_nav: |
  /export/blag-kb.md

extra_css:
  - assets/extra.css


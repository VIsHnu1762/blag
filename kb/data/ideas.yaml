  - {id: P-36, area: growth, title: Contact sync, description: "Find friends from the address book.", source: Talk, release: Later, notes: "Off by default, no auto-invites (D-07)"}
  - {id: P-37, area: growth, title: Circle vs circle, description: "Friendly matches between circles.", source: Table, release: Later, notes: Only once circles are stable}
  - {id: P-38, area: cards, title: Movie card, description: "Rate a film and guess each other's rating.", source: "Talk, Insp", release: Later, notes: No sensitive data}
  - {id: P-39, area: cards, title: Meme card, description: "Pick the meme that fits a friend.", source: Talk, release: Later, notes: Needs moderation thinking}
  - {id: P-40, area: cards, title: Music card, description: "Guess whose song is whose.", source: Talk, release: Later, notes: Licensing check needed}
  - {id: P-41, area: cards, title: Productivity card, description: "Claims about focus time or tasks done.", source: Talk, release: Later, notes: Fits a focus lane}
  - {id: P-42, area: cards, title: Voice claims, description: "Make your claim as a short voice note.", source: Table, release: Research, notes: Needs privacy review}
  - {id: P-43, area: cards, title: Shared circle goal, description: "An opt-in shared challenge such as a phone-free dinner.", source: Insp, release: Later, notes: Never a group punishment}
  - {id: P-44, area: cards, title: Real-world good at the finale, description: "For example a tree planted for an active circle.", source: Insp, release: Research, notes: Needs a partner and funding}
  - {id: P-45, area: data, title: Manual entry, description: "Type the number from the phone's own screen-time page.", source: Spec, release: MVP, notes: Works everywhere}
  - {id: P-46, area: data, title: Android auto-read, description: "Read app usage with the Usage Access permission.", source: Spec, release: Research, notes: Granted in system settings}

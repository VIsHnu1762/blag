# Decision log: single source of truth.
# status: Agreed (team stated it) | Proposed (needs explicit sign-off) | Superseded
meta:
  title: Decision log
  last_updated: 2026-11-04
items:
  - {id: D-01, date: 2026-11-04, decision: "Product title is BLAG: Are You Bluffing?", alternatives: "Trust Me, Bro; Caught You!; Ten Minutes with Your People", reason: "Short, memorable, and a line friends actually say", status: Agreed}
  - {id: D-02, date: 2026-11-01, decision: "BLAG was chosen for being unique and recognisable, not as British slang; copy stays neutral and international", alternatives: "British-flavoured copy", reason: "Wider audience; matches the team's intent", status: Agreed}
  - {id: D-03, date: 2026-11-01, decision: "BLAG is a daily ritual with a monthly league and finale, not a one-off party game", alternatives: "8-12 round sessions in temporary rooms", reason: "Builds habit and a reason to return", status: Agreed}
  - {id: D-04, date: 2026-11-04, decision: "Category: private social game built around a daily friend ritual", alternatives: "Social media; productivity app; gamified wellness tracker", reason: "Matches the experience and avoids health-ranking pressure", status: Agreed}
  - {id: D-05, date: 2026-11-01, decision: "League points come from skill (reading, bluffing, guessing), never from stat values", alternatives: "Points for 'better' stats", reason: "Nobody is structurally last because of their habits", status: Proposed}
  - {id: D-06, date: 2026-11-01, decision: "Every member gets a title at the finale; titles describe play style, not habits", alternatives: "Rank-only finale", reason: "Nobody leaves with guilt or pride about habits", status: Proposed}
  - {id: D-07, date: 2026-11-01, decision: "Contact sync is optional, off by default and a later feature; MVP uses invite links, QR codes and a one-at-a-time contact picker", alternatives: "Address-book upload at signup", reason: "Contacts are third-party data", status: Proposed}
  - {id: D-08, date: 2026-11-01, decision: "Missed days carry no penalty and are never shown to the circle", alternatives: "Streaks; missed-day counts", reason: "Everyone stays involved, no guilt", status: Agreed}
  - {id: D-09, date: 2026-11-04, decision: "Build one great loop first; other card types come later", alternatives: "Several card types at once", reason: "Avoids scope creep before the core is proven", status: Proposed}
  - {id: D-10, date: 2026-11-01, decision: "Personal and league layers connect through stories, not numbers; personal data is compared only with your own baseline", alternatives: "Shared personal charts", reason: "Interconnected, nothing to feel guilt or pride about", status: Agreed}
  - {id: D-11, date: 2026-11-01, decision: "One daily drop per circle in the circle's home time zone, with a 24-hour window", alternatives: "A fixed global clock time", reason: "Circles may span countries", status: Proposed}
  - {id: D-12, date: 2026-11-01, decision: "Align with international standards (GDPR, DPDP, WCAG 2.2 AA, OWASP MASVS, ISO documentation standards); claim alignment, not certification", alternatives: "No formal standards", reason: "Team requirement", status: Agreed}
  - {id: D-13, date: 2026-11-04, decision: "Primary users are close friend groups of 3-8, roughly 18-30; first market likely university friend groups", alternatives: "Broad audience; teenagers", reason: "Dense daily contact, easy to test with", status: Proposed}
  - {id: D-14, date: 2026-11-04, decision: "The knowledge base serves people and AI agents from the same files: frontmatter on every page, YAML registers as the source of truth, generated indexes", alternatives: "Separate docs for agents", reason: "One source of truth; nothing drifts", status: Agreed}
  - {id: D-15, date: 2026-11-04, decision: "Today's Speaker stays secret until they claim; if they don't, a backup is chosen privately", alternatives: "Announce the Speaker at the drop", reason: "Absence is never visible to the circle", status: Proposed}
  - {id: D-16, date: 2026-11-04, decision: "Season score is the sum of each player's best 20 daily scores", alternatives: "Sum of all days; average per day played", reason: "Missing up to about 10 days costs nothing; playing more never hurts", status: Proposed}
  - {id: D-17, date: 2026-11-04, decision: "Trust levels (typed, screenshot, auto-read) show badges only and never change points", alternatives: "Bonus points for verified numbers", reason: "iPhone players can't auto-read, so bonuses would be unfair", status: Proposed}
  - {id: D-18, date: 2026-11-04, decision: "Voters never lose points for a wrong read", alternatives: "Negative points for wrong reads (original spec)", reason: "Forgive-by-default principle; keeps quiet players playing", status: Proposed}
  - {id: D-19, date: 2026-11-04, decision: "Build BLAG with Expo + React Native (TypeScript) for Android and iOS; review after the prototype in light of Shopify's return to native", alternatives: "Two native apps (SwiftUI + Compose) built with AI coding agents; Flutter; Swift-only iOS app", reason: "Founder's choice (2026-11-04). Solo builder; ~93% of phones in India run Android, so one codebase for both platforms matters; TypeScript shared with the game engine and Supabase. Swift is learned alongside for iOS-only parts (widget, Screen Time view, HealthKit)", status: Agreed}
  - {id: D-20, date: 2026-11-04, decision: "One monorepo (pnpm workspaces + Turborepo) with apps/, packages/ and supabase/; feature modules with enforced import boundaries (ADR-008, ADR-009)", alternatives: "Separate repositories; folders by file type", reason: "Shared game rules stay identical; structure scales from one developer to a team", status: Proposed}
  - {id: D-21, date: 2026-11-04, decision: "Backend split into seven domain services inside one Supabase project, connected by events on Supabase Queues; extract a service into its own microservice only when a trigger in the service map is met (ADR-010)", alternatives: "Full microservices now; one monolithic backend; one function per action", reason: "Founder wants classified, separately optimisable services; full microservices are too heavy for a solo MVP", status: Proposed}
  - {id: D-22, date: 2026-11-04, decision: "Backend writes go through one SQL function per use case that saves the change and its queue event in one transaction; points are computed on each read (score-on-write) so the reveal is a cheap state flip; scheduler runs every minute", alternatives: "Outbox table plus dispatcher; compute all points at reveal time; 5-minute ticks", reason: "No lost events; handles the 9pm peak; reveals within 2 minutes", status: Proposed}
  - {id: D-23, date: 2026-11-04, decision: "Separate in-app wording from code names: friendly, familiar words in the UI (Today's Drop, Lock it in, Call it, Season Wrap, Receipts) while code keeps glossary code names", alternatives: "Use the technical terms in the UI", reason: "Familiar words cut learning time for social and productivity users; code stays stable if wording changes", status: Proposed}
  - {id: D-24, date: 2026-11-04, decision: "Design rule: native plumbing, expressive game moments. Operate screens (sign-in, settings, invite, members, notifications) follow iOS and Android conventions; Experience screens (seal, claim, read, reveal, finale) carry BLAG's own look, motion and sound", alternatives: "One custom look everywhere; stock platform look everywhere", reason: "Uniqueness lands where people feel it, without the app feeling off-spec in the plumbing (Impeccable modes, S-86)", status: Proposed}
  - {id: D-25, date: 2026-11-04, decision: "Design toolkit: Design with Intent for UX strategy, wireframes and the dark-pattern check; Perception-First Design to diagnose key screens; Impeccable as the main design system (PRODUCT.md, DESIGN.md, iOS and Android rules, audits, later polish); Taste Skill for the public web pages only; React Bits as motion inspiration only, rebuilt in Reanimated", alternatives: "Anthropic frontend-design skill alone; a UI kit", reason: "Founder's long-used references (2026-11-04); one job per tool so they don't conflict", status: Agreed}
  - {id: D-26, date: 2026-11-04, decision: "Sign-in: email one-time code, Google, and Sign in with Apple on iPhone. Phone-number sign-in comes after the MVP", alternatives: "Phone OTP at launch; email only", reason: "Founder chose email code, Google and phone; Apple rule 4.8 requires an equivalent privacy-focused option when Google sign-in is offered (S-77, S-78); SMS costs money and needs sender registration in India", status: Agreed}
  - {id: D-27, date: 2026-11-04, decision: "Minimum age is 18+ by self-attestation at sign-up; the date of birth is not stored, only the attestation time and age-gate version", alternatives: "16+ with an age gate", reason: "Founder's choice; avoids parental-consent flows under DPDP and GDPR; data minimisation", status: Agreed}
  - {id: D-28, date: 2026-11-04, decision: "Truth-zone tolerance is 10% with unit floors: h = max(ceil(0.10 x seal), floor)", alternatives: "5%", reason: "Founder's choice; 10% forgives honest rounding", status: Agreed}
  - {id: D-29, date: 2026-11-04, decision: "Each circle plays 1 or 2 rounds per day. The organiser changes it, effective from the next day; the app suggests a change from the circle's involvement. With 2 rounds the reveals are at least 3 hours apart and the Speakers differ. A day can score up to 8; best-20 days is unchanged", alternatives: "Always one round; always two", reason: "Founder wants both, chosen by interest and involvement; the league is inside one circle, so everyone shares the setting and it stays fair", status: Agreed}
  - {id: D-30, date: 2026-11-04, decision: "Package manager is pnpm (workspaces, hoisted installs for React Native)", alternatives: "Bun; npm; Yarn", reason: "Founder asked for the most effective option for mobile; pnpm is the best-supported choice for Expo monorepos", status: Agreed}
  - {id: D-31, date: 2026-11-04, decision: "Public web pages are plain static HTML on free hosting, under 30 KB each. The invite page loads no data (it hands the code to the app or shows store buttons); only the account-deletion page signs the person in", alternatives: "A React or Next.js site", reason: "Founder's choice; fastest load and nothing private leaks from a link", status: Agreed}
  - {id: D-32, date: 2026-11-04, decision: "Release notes and versions are managed with Changesets", alternatives: "semantic-release; hand-written notes", reason: "Founder agreed; fits a pnpm monorepo", status: Agreed}
  - {id: D-33, date: 2026-11-04, decision: "Animation: Reanimated for the MVP; try Rive after the core game works", alternatives: "Rive or Lottie from the start", reason: "Founder's choice; core functionality comes before polish", status: Agreed}
  - {id: D-34, date: 2026-11-04, decision: "No Apple Family Controls (Screen Time) entitlement for the MVP; iPhone stats are typed in", alternatives: "Apply now for a private check-your-number view", reason: "Founder's choice; approval is slow and the data can't leave the device anyway (R-01)", status: Agreed}
  - {id: D-35, date: 2026-11-04, decision: "Work directly on main during the MVP; add a branch and pull-request workflow later only if needed", alternatives: "Feature branches from day one", reason: "Founder's choice; solo builder", status: Agreed}
  - {id: D-36, date: 2026-11-04, decision: "Design starts low-fidelity (greyscale, system font, real copy, proper layout); colours, fonts and brand visuals come only after the core works", alternatives: "Pick the palette now", reason: "Founder's choice; function first", status: Agreed}
  - {id: D-37, date: 2026-11-04, decision: "Store category: Games > Casual as the main category, Social Networking as Apple's second category; confirm at submission", alternatives: "Social Networking as the main category", reason: "BLAG is a game first; Social Networking draws heavier review", status: Proposed}
  - {id: D-38, date: 2026-11-04, decision: "Money: free for the MVP; never ads and never selling data; later, optional cosmetics and extra card packs (movies, memes, music); never paying for points", alternatives: "Ads; subscriptions at launch", reason: "Protects the red lines; revenue only from things that don't change who wins", status: Proposed}
  - {id: D-39, date: 2026-11-04, decision: "Steps and sleep are treated as health data at the GDPR special-category level even though India's DPDP Act has no separate category: separate opt-in per health stat, never used in analytics, and the number is deleted at the reveal. In the MVP they are typed in; no HealthKit or Health Connect permissions", alternatives: "Treat like screen time; read from HealthKit and Health Connect at launch", reason: "Strictest common standard (S-81); avoids health-permission store reviews in the MVP", status: Proposed}
  - {id: D-40, date: 2026-11-04, decision: "Database is written as plain SQL migrations (supabase/migrations) with generated TypeScript types; no Prisma or other ORM for the MVP (ADR-011)", alternatives: "Prisma; Prisma Next; Drizzle", reason: "Access rules, sealed values, queues and cron live in the database, which an ORM doesn't help with; Prisma can bypass RLS (S-83); Prisma Next's Supabase support is new (S-82)", status: Proposed}
  - {id: D-41, date: 2026-11-04, decision: "The app only reads, through api views filtered by RLS; every write goes through an Edge Function that connects as its own service role and can only run that service's functions (ADR-012)", alternatives: "App writes tables directly under RLS; one shared service-role key", reason: "Least privilege per service; ownership enforced by the database itself", status: Proposed}
  - {id: D-42, date: 2026-11-04, decision: "User-generated content is kept minimal: free text only in display names and circle names; reactions are a fixed emoji set. A blocked-terms filter, Report, Block and a contact email meet Apple guideline 1.2", alternatives: "Free-text comments and chat in the MVP", reason: "Apple 1.2 requires filter, report and block (S-79, S-80); less text means less moderation", status: Proposed}
  - {id: D-43, date: 2026-11-04, decision: "Screenshot proof (the screenshot trust level) is deferred past the MVP; MVP seals are typed", alternatives: "Screenshot upload at launch", reason: "Uploaded images are user content that needs image moderation (D-42); trust levels never change points anyway (D-17)", status: Proposed}
  - {id: D-44, date: 2026-11-04, decision: "Testing: Vitest + fast-check for the game engine, pgTAP (supabase test db) for SQL and access rules, Deno test for Edge Functions, Jest + React Native Testing Library for screens, Maestro for end-to-end flows; one shared test-vector file runs against both the TypeScript and SQL scoring", alternatives: "Unit tests only", reason: "Founder asked for the best frameworks for game rules and access rules", status: Agreed}
  - {id: D-45, date: 2026-11-04, decision: "The two-week WhatsApp test runs alongside the first two weeks of the build; the Speaker DMs the real number to the founder before posting the claim", alternatives: "Test before building", reason: "Founder's choice; no deadline, learn while building", status: Agreed}
  - {id: D-46, date: 2026-11-04, decision: "Release documents (privacy policy, terms, deletion page, support page, store privacy forms, age-rating forms, name check, grievance contact) are drafted alongside the build, not at the end", alternatives: "Write them before submission", reason: "Founder's choice; avoids a release-week scramble", status: Agreed}
